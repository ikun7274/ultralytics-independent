name: ooo-quality

# Quality gate for the ultralytics_ooo package: lint + the package's own test suite.
#
# Scope: this workflow only looks at ultralytics_ooo/ and tests/test_ooo_*.py. It deliberately does NOT
# run upstream's test suite (that belongs to the pristine Ultralytics tree) and it does not modify
# upstream's pyproject.toml -- the package carries its own ruff config next to the code.
#
# Why the suite matters here: the package's whole strategy is replacing upstream internals at runtime,
# so its failure mode is silent behaviour drift, not a crash. Several real defects (dual-metric
# degradation, three per-epoch ratio knobs never reaching the dataset) were invisible to the code and
# only showed up as wrong numbers. Every fix in this workflow's test set is a regression guard for one
# of those.

on:
  push:
    paths:
      - "ultralytics_ooo/**"
      - "tests/test_ooo_*.py"
      - ".github/workflows/ooo-quality.yml"
  pull_request:
    paths:
      - "ultralytics_ooo/**"
      - "tests/test_ooo_*.py"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      # `ultralytics_ooo/ruff.toml` is discovered automatically because it sits next to the code.
      - name: Lint the package
        run: ruff check ultralytics_ooo
      # The package's own tests live in upstream's tests/ directory, so they would otherwise inherit
      # upstream's config -- and pyproject.toml sets no `select`, i.e. ruff's *defaults*, which are
      # neither the package's rules nor stable across ruff releases. Pin the rule list explicitly
      # (same as ultralytics_ooo/ruff.toml) so this gate cannot silently drift.
      - name: Lint the package's tests
        run: ruff check --select E,W,F,B,BLE,I,UP tests/test_ooo_*.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install test deps
        run: python -m pip install pytest pyyaml
      # The whole ooo suite is offline: tests/test_ooo_branches.py writes its own 4-image dataset to a
      # temp dir, so no data download and no weights are needed.
      - name: Run the package test suite
        run: python -m pytest tests/ -k ooo -q
